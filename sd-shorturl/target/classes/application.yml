spring:
  application:
    name: sd-shorturl
  datasource:
    url: jdbc:h2:mem:shorturl;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=50000,expireAfterWrite=3600s

server:
  port: 8081

systemdesign:
  shorturl:
    base-host: http://localhost:8081

management:
  endpoint:
    health:
      probes:
        enabled: true
