spring:
  application:
    name: sd-pastebin
  datasource:
    url: jdbc:h2:mem:pastebin;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8082

systemdesign:
  snowflake:
    machine-id: 2
